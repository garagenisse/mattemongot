<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="tab-dash" href="/tabs/tab-dash">
      <ion-icon aria-hidden="true" name="home"></ion-icon>
      <ion-label>{{ 'tabs.levels' | translate }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab-play" href="/tabs/tab-play">
      <ion-icon aria-hidden="true" name="game-controller"></ion-icon>
      <ion-label>{{ 'tabs.play' | translate }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab-settings" href="/tabs/tab-settings">
      <ion-icon aria-hidden="true" name="settings"></ion-icon>
      <ion-label>{{ 'tabs.settings' | translate }}</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
